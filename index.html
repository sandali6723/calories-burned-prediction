<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaloriBurn - AI Calorie Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #F7931E;
            --accent: #FDC830;
            --dark: #1a1a2e;
            --darker: #0f0f1e;
            --light: #eee;
            --success: #00d4aa;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(247, 147, 30, 0.1) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 95%;
            max-width: 1200px;
            height: 95vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 25px;
            flex: 1;
            overflow: hidden;
        }

        .card {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 8px;
            color: var(--light);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        select {
            cursor: pointer;
        }

        option {
            background: var(--dark);
            color: var(--light);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-container {
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .result-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .result-label {
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 15px;
            border: 4px solid rgba(255, 107, 53, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .placeholder {
            opacity: 0.6;
        }

        .placeholder-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4444;
            color: #ffaaaa;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            display: none;
            font-size: 0.85rem;
        }

        .error.show {
            display: block;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            body {
                height: auto;
                overflow: auto;
            }
            
            .container {
                height: auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CaloriBurn</h1>
            <p class="subtitle">AI-Powered Calorie Predictor</p>
        </header>

        <div class="main-content">
            <div class="card">
                <form id="predictionForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="age">Age (years)</label>
                            <input type="number" id="age" name="age" min="10" max="100" required placeholder="28">
                        </div>

                        <div class="form-group">
                            <label for="height">Height (m)</label>
                            <input type="number" id="height" name="height" step="0.01" min="1.0" max="2.5" required placeholder="1.75">
                        </div>

                        <div class="form-group">
                            <label for="weight">Weight (kg)</label>
                            <input type="number" id="weight" name="weight" step="0.1" min="30" max="200" required placeholder="70">
                        </div>

                        <div class="form-group">
                            <label for="session_duration">Duration (hours)</label>
                            <input type="number" id="session_duration" name="session_duration" step="0.1" min="0.1" max="5" required placeholder="1.5">
                        </div>

                        <div class="form-group">
                            <label for="workout_type">Workout Type</label>
                            <select id="workout_type" name="workout_type" required>
                                <option value="">Select</option>
                                <option value="Yoga">Yoga</option>
                                <option value="HIIT">HIIT</option>
                                <option value="Cardio">Cardio</option>
                                <option value="Strength">Strength</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="resting_bpm">Resting BPM</label>
                            <input type="number" id="resting_bpm" name="resting_bpm" min="40" max="100" required placeholder="70">
                        </div>

                        <div class="form-group">
                            <label for="avg_bpm">Average BPM</label>
                            <input type="number" id="avg_bpm" name="avg_bpm" min="60" max="200" required placeholder="140">
                        </div>

                        <div class="form-group">
                            <label for="max_bpm">Maximum BPM</label>
                            <input type="number" id="max_bpm" name="max_bpm" min="80" max="220" required placeholder="156">
                        </div>

                        <div class="form-group">
                            <label for="experience_level">Experience</label>
                            <select id="experience_level" name="experience_level" required>
                                <option value="">Select</option>
                                <option value="1">Beginner</option>
                                <option value="2">Intermediate</option>
                                <option value="3">Advanced</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn">Predict Calories</button>

                    <div class="error" id="errorBox"></div>
                </form>
            </div>

            <div class="card result-card">
                <div class="placeholder" id="placeholder">
                    <div class="placeholder-icon">🔥</div>
                    <h2>Your Results</h2>
                    <p style="margin-top: 10px; font-size: 0.9rem;">Fill the form to see<br>your calorie estimate</p>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Calculating...</p>
                </div>

                <div class="result-container" id="resultContainer">
                    <h2 style="color: var(--accent); margin-bottom: 10px;">Calories Burned</h2>
                    <div class="result-value" id="resultValue">0</div>
                    <p class="result-label">Calories</p>
                    <button class="btn" onclick="resetForm()" style="margin-top: 25px; max-width: 200px;">Calculate Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultContainer = document.getElementById('resultContainer');
        const resultValue = document.getElementById('resultValue');
        const loading = document.getElementById('loading');
        const placeholder = document.getElementById('placeholder');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            resultContainer.classList.remove('show');
            placeholder.style.display = 'none';
            loading.classList.add('show');
            errorBox.classList.remove('show');

            const formData = {
                gender: document.getElementById('gender').value,
                age: document.getElementById('age').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                session_duration: document.getElementById('session_duration').value,
                workout_type: document.getElementById('workout_type').value,
                resting_bpm: document.getElementById('resting_bpm').value,
                avg_bpm: document.getElementById('avg_bpm').value,
                max_bpm: document.getElementById('max_bpm').value,
                experience_level: document.getElementById('experience_level').value
            };

            try {
                const response = await fetch('http://localhost:5000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    setTimeout(() => {
                        loading.classList.remove('show');
                        resultValue.textContent = data.calories_burned.toFixed(1);
                        resultContainer.classList.add('show');
                    }, 800);
                } else {
                    throw new Error(data.error || 'Prediction failed');
                }
            } catch (error) {
                loading.classList.remove('show');
                placeholder.style.display = 'block';
                errorBox.textContent = `Error: ${error.message}. Make sure the Flask server is running on port 5000.`;
                errorBox.classList.add('show');
            }
        });

        function resetForm() {
            form.reset();
            resultContainer.classList.remove('show');
            placeholder.style.display = 'block';
            errorBox.classList.remove('show');
        }
    </script>
</body>
</html>
